blueprint:
  name: Einspeisewacht – Hinweis am Vortag / Notice the day before
  description: >-
    Schickt dir einmal am Tag zur gewählten Uhrzeit eine Nachricht aufs Handy,
    wenn es morgen Zeitfenster ohne Einspeisevergütung gibt – zum Beispiel
    „11:00–14:30 und 15:00–15:45 Uhr ohne Vergütung.“ So kannst du den Speicher,
    die Wallbox oder die Waschmaschine darauf einstellen. Gibt es morgen keine,
    kommt keine Nachricht. Unter „Weitere Aktionen“ gehen auch Telegram und
    andere Dienste. Im Titel steht der Name der Anlage, die Nachricht gibt es
    auf Deutsch oder Englisch. Die Zeitfenster stammen aus dem Kalender
    „Negative Preise“ von Einspeisewacht. Die Day-Ahead-Preise für morgen sind
    ab etwa 13 Uhr bekannt; wähle deshalb eine Uhrzeit am Nachmittag oder Abend.


    Sends you a message on your phone once a day at the chosen time when
    tomorrow has windows without feed-in remuneration – for example
    "11:00–14:30 and 15:00–15:45 without remuneration." So you can set up the
    battery, the wallbox or the washing machine for them. If there are none
    tomorrow, no message comes. Telegram and other services go under "More
    actions". The title names the plant, the message comes in German or
    English. The windows come from the calendar "Negative prices" of
    Einspeisewacht. Tomorrow's day-ahead prices are known from about 13:00, so
    pick a time in the afternoon or evening.
  domain: automation
  author: Einspeisewacht
  homeassistant:
    min_version: "2026.3.0"
  source_url: https://github.com/einspeisewacht/integration/blob/main/blueprints/automation/einspeisewacht/hinweis_am_vortag.yaml
  input:
    calendar:
      name: Kalender „Negative Preise“ / Calendar "Negative prices"
      description: >-
        Der Kalender deiner Anlage. / The calendar of your plant.
      selector:
        entity:
          filter:
            integration: einspeisewacht
            domain: calendar
    notify_device:
      name: Handy (optional) / Phone (optional)
      description: >-
        Ein Handy mit der Home-Assistant-App. Leer lassen, wenn die Nachricht
        nur über „Weitere Aktionen“ gehen soll. / A phone with the Home
        Assistant app. Leave empty if the message should only go through "More
        actions".
      default: ""
      selector:
        device:
          filter:
            integration: mobile_app
    time:
      name: Uhrzeit / Time
      description: >-
        Wann die Nachricht kommt. Vor etwa 14 Uhr fehlen oft noch die Preise
        für morgen. / When the message comes. Before about 14:00, tomorrow's
        prices are often still missing.
      default: "18:00:00"
      selector:
        time: {}
    language:
      name: Sprache der Nachricht / Language of the message
      default: de
      selector:
        select:
          options:
            - label: Deutsch
              value: de
            - label: English
              value: en
    more:
      name: Weitere Aktionen (optional) / More actions (optional)
      icon: mdi:send
      description: >-
        Für Telegram, Signal, Sprachausgabe und Ähnliches. / For Telegram,
        Signal, speech output and the like.
      collapsed: true
      input:
        extra_actions:
          name: Weitere Aktionen / More actions
          description: >-
            Laufen mit dem fertigen Text, wenn es morgen Zeitfenster ohne
            Vergütung gibt. Nutzbar sind {{ title }} und {{ message }}.
            Beispiel Telegram: Aktion telegram_bot.send_message mit message:
            "{{ title }}: {{ message }}". / Run with the finished text when
            tomorrow has windows without remuneration. You can use {{ title }}
            and {{ message }}. Example Telegram: action
            telegram_bot.send_message with message: "{{ title }}: {{ message
            }}".
          default: []
          selector:
            action: {}

mode: single

triggers:
  - trigger: time
    at: !input time

variables:
  calendar: !input calendar
  notify_device: !input notify_device
  lang: !input language
  # Titles of the windows without remuneration in the calendar (calendar.py,
  # TEXTS), German and English by the language of Home Assistant. Windows the
  # rule does not apply to yet ("still remunerated") are left out.
  unpaid_titles:
    - Keine Einspeisevergütung
    - No feed-in remuneration
  # The plant of the calendar, for the title; without a device just
  # Einspeisewacht.
  device: "{{ device_name(calendar) or '' }}"
  head: "{{ 'Einspeisewacht' ~ (' · ' ~ device if device else '') }}"
  # The phone's notify action: mobile_app names it after the registered device.
  phone_action: >-
    {%- set d = device_attr(notify_device, 'name') if notify_device else none -%}
    {{ 'notify.mobile_app_' ~ (d | slugify) if d else '' }}

actions:
  # Tomorrow from midnight to midnight, local time (23 or 25 hours on the
  # days the clocks change).
  - action: calendar.get_events
    target:
      entity_id: !input calendar
    data:
      start_date_time: "{{ (today_at() + timedelta(days=1)).isoformat() }}"
      end_date_time: "{{ (today_at() + timedelta(days=2)).isoformat() }}"
    response_variable: agenda
  - variables:
      windows: >-
        {{ agenda[calendar].events | selectattr('summary', 'in', unpaid_titles) | list }}
  - condition: template
    value_template: "{{ windows | count > 0 }}"
  # A window up to midnight ends at "24:00", not "00:00".
  - variables:
      title: >-
        {{ head ~ ': ' ~ ('Negative Strompreise morgen' if lang == 'de'
           else 'Negative electricity prices tomorrow') }}
      message: >-
        {%- set ns = namespace(times=[]) -%}
        {%- for window in windows -%}
        {%- set end = (window.end | as_datetime | as_local).strftime('%H:%M') -%}
        {%- set ns.times = ns.times + [(window.start | as_datetime | as_local).strftime('%H:%M')
          ~ '–' ~ ('24:00' if end == '00:00' else end)] -%}
        {%- endfor -%}
        {%- if ns.times | count > 1 -%}
        {%- set times = ns.times[:-1] | join(', ') ~ (' und ' if lang == 'de' else ' and ') ~ ns.times[-1] -%}
        {%- else -%}
        {%- set times = ns.times[0] -%}
        {%- endif -%}
        {{ times ~ (' Uhr ohne Vergütung.' if lang == 'de' else ' without remuneration.') }}
  - if:
      - condition: template
        value_template: "{{ phone_action != '' }}"
    then:
      - action: "{{ phone_action }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - sequence: !input extra_actions
